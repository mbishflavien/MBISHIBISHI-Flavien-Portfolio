<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Vibrant SailPoint Border Gradient (Cyan -> Electric Blue -> Magenta) -->
    <linearGradient id="sailpointBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="30%" stop-color="#0077FF"/>
      <stop offset="70%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <!-- 3D decorative sphere gradients -->
    <radialGradient id="sphereTopLeft" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FCE4EC"/>
      <stop offset="60%" stop-color="#F48FB1"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </radialGradient>
    <radialGradient id="sphereBottomRight" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="40%" stop-color="#7C4DFF"/>
      <stop offset="80%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
