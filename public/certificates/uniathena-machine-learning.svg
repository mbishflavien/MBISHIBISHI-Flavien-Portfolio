<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background:#FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E00063"/>
      <stop offset="100%" stop-color="#C20054"/>
    </linearGradient>
    <pattern id="circuitPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M10 0v20h20v20h20v20 M30 0v10h10v20h20 M0 40h20v20" fill="none" stroke="#FF4081" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="10" cy="20" r="2" fill="#FF80AB" fill-opacity="0.6"/>
      <circle cx="30" cy="30" r="2" fill="#FF80AB" fill-opacity="0.6"/>
      <circle cx="50" cy="40" r="2" fill="#FF80AB" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Top Right UniAthena Logo Area -->
  <g transform="translate(1000, 40)">
    <text x="0" y="32" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">uni<tspan fill="#0F172A">thêna</tspan></text>
    <!-- Accent icon on Athena -->
    <path d="M58 8 C58 4, 66 4, 66 8 C68 12, 56 12, 58 8 Z" fill="#E00063"/>
  </g>

  <!-- Right Vertical Decorative Strip -->
  <g transform="translate(1055, 100)">
    <rect width="145" height="600" fill="url(#magentaGrad)"/>
    <rect width="145" height="600" fill="url(#circuitPattern)"/>
    <!-- Sleek abstract tech lines -->
    <path d="M20 0 v600 M60 0 v600 M100 0 v600 M0 150 h145 M0 300 h145 M0 450 h145" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2"/>
  </g>
  <!-- Bottom bar on right strip -->
  <rect x="1055" y="720" width="145" height="80" fill="#E00063"/>

  <!-- Top Left CIQ Logo -->
  <g transform="translate(80, 50)">
    <!-- CIQ mark -->
    <text x="0" y="46" font-size="48" font-weight="900" fill="#334155" letter-spacing="-1.5">CIQ</text>
    <line x1="115" y1="10" x2="115" y2="50" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="130" y="22" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.8">CAMBRIDGE</text>
    <text x="130" y="35" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.8">INTERNATIONAL</text>
    <text x="130" y="48" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.8">QUALIFICATIONS</text>
  </g>

  <!-- Certificate Body -->
  <text x="80" y="200" font-size="17" font-weight="500" fill="#475569">15, September 2026</text>

  <text x="80" y="255" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Mbishibishi Flavien</text>

  <text x="80" y="295" font-size="17" font-weight="500" fill="#475569">has successfully completed</text>

  <text x="80" y="345" font-size="30" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Basics of Machine Learning</text>
  <text x="80" y="385" font-size="30" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Algorithms</text>

  <text x="80" y="432" font-size="15" font-weight="500" fill="#334155">This course has been developed and delivered by UniAthena in partnership</text>
  <text x="80" y="456" font-size="15" font-weight="500" fill="#334155">with Cambridge International Qualifications, UK</text>

  <!-- Signature -->
  <g transform="translate(80, 495)">
    <!-- Calligraphic signature path for Huw Flynn Hughes -->
    <path d="M10 35 Q25 10, 35 25 T60 20 T90 28 T120 18 T150 25 T170 15 Q190 5, 205 30 T230 18" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 15 L25 45 M75 10 L85 40 M140 10 L150 42" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="55" x2="360" y2="55" stroke="#94A3B8" stroke-width="1"/>
    <text x="0" y="78" font-size="16" font-weight="700" fill="#0F172A">Huw Flynn Hughes</text>
    <text x="0" y="98" font-size="13" font-weight="500" fill="#64748B">Responsible Officer | Cambridge International Qualifications, UK</text>
  </g>

  <!-- Bottom Accreditation & FEDE -->
  <g transform="translate(80, 680)">
    <!-- FEDE Logo stylized -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="16" height="28" fill="#EAB308" rx="2"/>
      <rect x="18" y="0" width="16" height="28" fill="#3B82F6" rx="2"/>
      <rect x="36" y="0" width="16" height="28" fill="#EF4444" rx="2"/>
      <rect x="54" y="0" width="16" height="28" fill="#10B981" rx="2"/>
      <text x="3" y="19" font-size="13" font-weight="900" fill="#FFFFFF">F</text>
      <text x="21" y="19" font-size="13" font-weight="900" fill="#FFFFFF">E</text>
      <text x="39" y="19" font-size="13" font-weight="900" fill="#FFFFFF">D</text>
      <text x="57" y="19" font-size="13" font-weight="900" fill="#FFFFFF">E</text>
    </g>
    <text x="85" y="13" font-size="12" font-weight="500" fill="#475569">Athena Global Education is a member institution</text>
    <text x="85" y="27" font-size="12" font-weight="500" fill="#475569">of Federation for European Education (FEDE).</text>
  </g>

  <line x1="430" y1="680" x2="430" y2="725" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Blockchain Verification Text -->
  <g transform="translate(450, 685)">
    <text x="0" y="10" font-size="12" font-weight="500" fill="#475569">This is a blockchain verified certificate, the authenticity of this document can</text>
    <text x="0" y="26" font-size="12" font-weight="500" fill="#475569">be verified by scanning the QR code at the end of the document.</text>
  </g>

  <!-- QR Code & Blockchain ID block -->
  <g transform="translate(910, 555)">
    <text x="60" y="0" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Scan to verify this certificate</text>
