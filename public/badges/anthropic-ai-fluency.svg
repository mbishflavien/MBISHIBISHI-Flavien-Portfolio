<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" style="background:#687A53; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="#687A53"/>
  
  <!-- Subtle Outer Border Accent -->
  <rect x="24" y="24" width="1152" height="802" fill="none" stroke="#182312" stroke-width="1.5" stroke-opacity="0.2" rx="16"/>

  <!-- Top Badge: CERTIFICATE of COMPLETION -->
  <g transform="translate(600, 150)">
    <!-- Capsule outline -->
    <rect x="-310" y="-36" width="620" height="72" rx="36" fill="none" stroke="#141E10" stroke-width="2.5"/>
    
    <!-- Circular Checkmark Icon -->
    <g transform="translate(-250, 0)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#141E10" stroke-width="2.5"/>
      <path d="M-8 0 L-2 7 L9 -7" fill="none" stroke="#141E10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Text -->
    <text x="30" y="8" font-size="21" font-weight="700" fill="#141E10" letter-spacing="4.5" text-anchor="middle">CERTIFICATE <tspan font-weight="400" font-style="italic" letter-spacing="2">of</tspan> COMPLETION</text>
  </g>

  <!-- Recipient Name -->
  <g transform="translate(600, 310)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="400" fill="#10170D" text-anchor="middle" letter-spacing="0.5">
      MBISHIBISHI <tspan font-weight="400">Flavien</tspan>
    </text>
  </g>

  <!-- 'has completed' -->
  <g transform="translate(600, 390)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="400" fill="#1E2A18" text-anchor="middle">
      has completed
    </text>
  </g>

  <!-- Course Title -->
  <g transform="translate(600, 480)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#0F160C" text-anchor="middle" letter-spacing="-0.5">
      AI Fluency: Framework
    </text>
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#0F160C" text-anchor="middle" letter-spacing="-0.5">
      &amp; Foundations
    </text>
  </g>

  <!-- ANTHROPIC Logo -->
  <g transform="translate(600, 650)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="900" fill="#11190D" text-anchor="middle" letter-spacing="5">
      ANTHROPC
    </text>
  </g>

  <!-- Bottom Partner Institutional Marks -->
  <g transform="translate(600, 735)">
    <!-- UCC -->
    <g transform="translate(-380, 0)">
      <g transform="translate(0, -14)">
        <rect x="0" y="0" width="18" height="24" fill="none" stroke="#1C2615" stroke-width="1.5" rx="2"/>
        <path d="M4 6h10 M4 12h10 M4 18h10" stroke="#1C2615" stroke-width="1"/>
        <text x="26" y="18" font-size="22" font-weight="900" font-family="Georgia, serif" fill="#1C2615" letter-spacing="0.5">UCC</text>
        <text x="0" y="32" font-size="7" font-weight="600" fill="#22301B" letter-spacing="0.2">University College Cork, Ireland</text>
      </g>
    </g>

    <!-- Ringling College -->
    <g transform="translate(-150, 0)">
      <g transform="translate(0, -10)">
        <polygon points="0,14 12,0 24,14 12,28" fill="none" stroke="#1C2615" stroke-width="1.8"/>
        <text x="34" y="10" font-size="10" font-weight="700" fill="#1C2615">Ringling College</text>
        <text x="34" y="22" font-size="9" font-weight="500" fill="#22301B">of Art + Design</text>
      </g>
    </g>

    <!-- HEA -->
    <g transform="translate(80, 0)">
      <g transform="translate(0, -12)">
        <text x="0" y="20" font-size="22" font-weight="900" fill="#1C2615" letter-spacing="1">HEA</text>
        <line x1="54" y1="-2" x2="54" y2="26" stroke="#1C2615" stroke-width="1.2"/>
        <text x="62" y="9" font-size="8.5" font-weight="700" fill="#1C2615">HIGHER EDUCATION AUTHORITY</text>
        <text x="62" y="19" font-size="7" font-weight="500" fill="#22301B">AN tÚDARÁS UM ARD-OIDEACHAS</text>
      </g>
    </g>

    <!-- National Forum -->
    <g transform="translate(320, 0)">
      <g transform="translate(0, -10)">
        <rect x="0" y="0" width="28" height="22" fill="#1C2615" rx="2"/>
        <text x="4" y="16" font-size="12" font-weight="800" fill="#687A53">T&amp;L</text>
        <text x="36" y="9" font-size="8.5" font-weight="700" fill="#1C2615">NATIONAL FORUM</text>
        <text x="36" y="18" font-size="6.5" font-weight="500" fill="#22301B">for the enhancement of teaching</text>
      </g>
    </g>
  </g>
</svg>