<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="nvBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2615" />
      <stop offset="70%" stop-color="#07120a" />
      <stop offset="100%" stop-color="#020503" />
    </radialGradient>
    <linearGradient id="nvGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76B900" />
      <stop offset="100%" stop-color="#4e7c00" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#76B900" />
    </linearGradient>
    <filter id="nvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#76B900" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Hexagonal Shield / Circle -->
  <circle cx="250" cy="250" r="230" fill="url(#nvBg)" filter="url(#nvGlow)" stroke="#76B900" stroke-width="5" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#76B900" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.4" />

  <!-- NVIDIA Eye Symbol -->
  <g transform="translate(250, 175)">
    <!-- Arc Outer -->
    <path d="M-85 0 C-85 -55 0 -85 0 -85 C0 -85 85 -55 85 0 C85 55 0 85 0 85 C0 85 -85 55 -85 0 Z" fill="none" stroke="#76B900" stroke-width="10" stroke-linejoin="round" />
    <!-- Center Pupil / Spiral Core -->
    <path d="M-45 0 C-45 -28 0 -45 0 -45 C0 -45 45 -28 45 0 C45 28 0 45 0 45 C0 45 -45 28 -45 0 Z" fill="#76B900" opacity="0.95" />
    <!-- Dark Eye Hole -->
    <ellipse cx="0" cy="0" rx="16" ry="16" fill="#07120a" />
    <!-- Core Bright Dot -->
    <circle cx="0" cy="0" r="7" fill="#76B900" />
  </g>

  <!-- NVIDIA Brand Text -->
  <text x="250" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">
    NVIDIA
  </text>
  
  <text x="250" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#76B900" text-anchor="middle">
    DEVELOPER BADGE
  </text>

  <!-- Google Cloud & NVIDIA Collaboration Pill -->
  <g transform="translate(250, 360)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#0c1e12" stroke="url(#cloudGrad)" stroke-width="2" />
    <g transform="translate(-112, 0)">
      <!-- Checkmark -->
      <circle cx="0" cy="0" r="10" fill="#76B900" />
      <path d="M-4 0 L-1 3 L5 -3" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="12" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1" fill="#f1f5f9" text-anchor="middle">
      GOOGLE CLOUD &amp; NVIDIA
    </text>
  </g>

  <!-- Footer attribution -->
  <text x="250" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#86efac" text-anchor="middle">
    ACCELERATED COMPUTING &amp; AI COMMUNITY
  </text>
</svg>
