<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="nvidiaRimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Dark Border and Rim -->
  <circle cx="250" cy="250" r="236" fill="url(#nvidiaRimGlow)" stroke="#27272a" stroke-width="3" filter="url(#badgeShadow)" />
  <circle cx="250" cy="250" r="230" fill="#18181b" />

  <!-- Crisp Thick White Ring -->
  <circle cx="250" cy="250" r="214" fill="none" stroke="#ffffff" stroke-width="20" />

  <!-- Inner Off-White Background Circle -->
  <circle cx="250" cy="250" r="204" fill="#f0f3f6" />

  <!-- NVIDIA Central Brand Emblem -->
  <g transform="translate(250, 225)">
    <!-- NVIDIA Lime Green Box (Behind Right Side of Eye) -->
    <rect x="-18" y="-90" width="94" height="88" rx="6" fill="#76B900" />

    <!-- Outer Eye Contour (Left side on light bg is Green, Right side on green bg is White) -->
    <!-- Left Green Loop -->
    <path d="M -72 -46 C -72 -70 -44 -86 -18 -89 L -18 -58 C -34 -56 -46 -52 -46 -46 C -46 -40 -34 -36 -18 -34 L -18 -3 C -44 -6 -72 -22 -72 -46 Z" fill="#76B900" />
    <!-- Right White Loop -->
    <path d="M -18 -89 C 18 -92 56 -70 56 -46 C 56 -22 18 0 -18 -3 L -18 -34 C 4 -36 26 -40 26 -46 C 26 -52 4 -56 -18 -58 Z" fill="#ffffff" />

    <!-- Inner Eye Spiral / Iris -->
    <path d="M -18 -74 C -34 -72 -40 -58 -40 -46 C -40 -34 -34 -24 -18 -20 L -18 -30 C -26 -32 -29 -38 -29 -46 C -29 -54 -24 -59 -18 -61 Z" fill="#76B900" />
    <path d="M -18 -74 L -18 -61 C -10 -59 10 -55 10 -46 C 10 -37 -10 -33 -18 -30 L -18 -20 C 6 -23 23 -33 23 -46 C 23 -59 6 -71 -18 -74 Z" fill="#ffffff" />

    <!-- Pupil Core -->
    <ellipse cx="-18" cy="-46" rx="7.5" ry="7.5" fill="#76B900" />
    <ellipse cx="-13" cy="-46" rx="3.5" ry="3.5" fill="#ffffff" />

    <!-- Solid Black nVIDIA Wordmark -->
    <g transform="translate(0, 48)">
      <!-- n -->
      <path d="M -86 -18 L -86 16 L -73 16 L -73 -3 C -73 -8 -69 -12 -63 -12 C -57 -12 -54 -8 -54 -3 L -54 16 L -41 16 L -41 -6 C -41 -15 -48 -22 -58 -22 C -68 -22 -73 -16 -76 -11 L -76 -20 L -86 -20 Z" fill="#000000" />
      
      <!-- V -->
      <path d="M -36 -20 L -25 16 L -12 16 L -1 -20 L -14 -20 L -18 3 L -23 -20 Z" fill="#000000" />

      <!-- I -->
      <path d="M 4 -20 L 16 -20 L 16 16 L 4 16 Z" fill="#000000" />

      <!-- D -->
      <path d="M 23 -20 L 44 -20 C 58 -20 67 -11 67 -2 C 67 7 58 16 44 16 L 23 16 Z M 35 -9 L 35 5 L 42 5 C 49 5 54 1 54 -2 C 54 -5 49 -9 42 -9 Z" fill="#000000" />

      <!-- I -->
      <path d="M 73 -20 L 85 -20 L 85 16 L 73 16 Z" fill="#000000" />

      <!-- A -->
      <path d="M 91 16 L 104 -20 L 119 -20 L 132 16 L 119 16 L 116 6 L 106 6 L 103 16 Z M 109 -2 L 114 -2 L 111 -12 Z" fill="#000000" />
    </g>
  </g>
</svg>
