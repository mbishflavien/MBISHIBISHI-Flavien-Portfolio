<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="gdgRimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <filter id="badgeShadowGDG" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Dark Border and Rim -->
  <circle cx="250" cy="250" r="236" fill="url(#gdgRimGlow)" stroke="#27272a" stroke-width="3" filter="url(#badgeShadowGDG)" />
  <circle cx="250" cy="250" r="230" fill="#18181b" />

  <!-- Crisp Thick White Ring -->
  <circle cx="250" cy="250" r="214" fill="none" stroke="#ffffff" stroke-width="20" />

  <!-- Inner Dark Charcoal Circle Fill -->
  <circle cx="250" cy="250" r="204" fill="#1b1b1f" />

  <!-- Top Graphic: GDG Angled Capsule Brackets < > -->
  <g transform="translate(250, 198)">
    <!-- LEFT CHEVRON < -->
    <!-- Top leg (Red) -->
    <rect x="-78" y="-42" width="60" height="24" rx="12" transform="rotate(-38 -48 -30)" fill="#ea4335" />
    <!-- Bottom leg (Peach) -->
    <rect x="-78" y="18" width="60" height="24" rx="12" transform="rotate(38 -48 30)" fill="#f6c4b4" />

    <!-- RIGHT CHEVRON > -->
    <!-- Top leg (Peach) -->
    <rect x="18" y="-42" width="60" height="24" rx="12" transform="rotate(38 48 -30)" fill="#f6c4b4" />
    <!-- Bottom leg (Red) -->
    <rect x="18" y="18" width="60" height="24" rx="12" transform="rotate(-38 48 30)" fill="#ea4335" />
  </g>

  <!-- Bottom Graphic: Three Red Outlined Circles O O O -->
  <g transform="translate(250, 310)">
    <!-- Left circle -->
    <circle cx="-72" cy="0" r="27" fill="none" stroke="#ea4335" stroke-width="4.5" />
    <!-- Middle circle -->
    <circle cx="0" cy="0" r="27" fill="none" stroke="#ea4335" stroke-width="4.5" />
    <!-- Right circle -->
    <circle cx="72" cy="0" r="27" fill="none" stroke="#ea4335" stroke-width="4.5" />
  </g>
</svg>
