<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="33%" stop-color="#EA4335" />
      <stop offset="66%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#34A853" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Circle with Shadow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)" filter="url(#badgeShadow)" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Outer subtle tech ring -->
  <circle cx="250" cy="250" r="215" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Top Google 4-Color Accent Dots -->
  <g transform="translate(250, 75)">
    <circle cx="-36" cy="0" r="6" fill="#4285F4" />
    <circle cx="-12" cy="0" r="6" fill="#EA4335" />
    <circle cx="12" cy="0" r="6" fill="#FBBC05" />
    <circle cx="36" cy="0" r="6" fill="#34A853" />
  </g>

  <!-- GDG Iconic Chevron Logo -->
  <g transform="translate(250, 185) scale(1.15)">
    <!-- Left Bracket < (Blue & Green) -->
    <path d="M-60 -36 L-30 -36 L-75 0 L-30 36 L-60 36 L-105 0 Z" fill="#4285F4" />
    <circle cx="-42" cy="0" r="7" fill="#34A853" />

    <!-- Center Slash / (Red & Yellow) -->
    <path d="M-10 40 L10 -40 L24 -40 L4 40 Z" fill="#EA4335" opacity="0.9" />

    <!-- Right Bracket > (Yellow & Red) -->
    <path d="M60 -36 L30 -36 L75 0 L30 36 L60 36 L105 0 Z" fill="#34A853" />
    <circle cx="42" cy="0" r="7" fill="#FBBC05" />
  </g>

  <!-- Title: GOOGLE DEVELOPER GROUPS -->
  <text x="250" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="3" fill="#ffffff" text-anchor="middle">
    GOOGLE DEVELOPER GROUPS
  </text>

  <!-- Subtitle: KIGALI CHAPTER -->
  <text x="250" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="4" fill="#60A5FA" text-anchor="middle">
    KIGALI CHAPTER
  </text>

  <!-- Verified Member Pill Banner -->
  <g transform="translate(250, 360)">
    <rect x="-115" y="-22" width="230" height="44" rx="22" fill="#1e293b" stroke="#38BDF8" stroke-width="2" />
    <g transform="translate(-85, 0)">
      <!-- Checkmark badge -->
      <circle cx="0" cy="0" r="10" fill="#34A853" />
      <path d="M-4 0 L-1 3 L5 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="10" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#f8fafc" text-anchor="middle">
      VERIFIED MEMBER
    </text>
  </g>

  <!-- Year / Proof footer -->
  <text x="250" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#94a3b8" text-anchor="middle">
    GOOGLE FOR DEVELOPERS COMMUNITY
  </text>
</svg>
