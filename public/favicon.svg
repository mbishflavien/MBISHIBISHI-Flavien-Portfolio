<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Circular container badge matching the design -->
  <circle cx="32" cy="32" r="30" fill="#ECEEF1" stroke="#D1D5DB" stroke-width="1.5" />
  
  <!-- Code brackets and slash: </> -->
  <g stroke="#18181B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left bracket < -->
    <path d="M 23 23 L 15 32 L 23 41" />
    
