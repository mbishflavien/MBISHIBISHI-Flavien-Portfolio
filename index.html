<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flavien MBISHIBISHI | Portfolio</title>
    <meta name="description" content="A modern, highly interactive personal portfolio website for Flavien MBISHIBISHI, a Software Engineering student, GDG Kigali member, and AI/ML enthusiast." />
    <meta property="og:title" content="Flavien MBISHIBISHI | Portfolio" />
    <meta property="og:description" content="A modern, highly interactive personal portfolio website for Flavien MBISHIBISHI, a Software Engineering student, GDG Kigali member, and AI/ML enthusiast." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://lh3.googleusercontent.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Non-blocking font loading -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <script>
      // Suppress benign Vite WebSocket errors in this environment
      window.addEventListener('error', (e) => {
        if (e.message && e.message.includes('failed to connect to websocket')) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', (e) => {
        if (e.reason && e.reason.toString().includes('WebSocket closed without opened')) {
          e.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
